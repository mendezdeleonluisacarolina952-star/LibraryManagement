
name: Build and SonarCloud Analysis

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV



permissions:
  contents: read

jobs:
  build:
    name: Build, Tests, SonarCloud and API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el codigo del repositorio
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      # 4. Compilar frontend React
      - name: Build frontend
        working-directory: client
        run: npm run build

      # 5. Instalar dependencias del backend
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      # 6. Ejecutar pruebas unitarias y generar cobertura
      - name: Run unit tests and generate coverage
        working-directory: server
        run: npm test -- --coverage

      # 7. Normalizar las rutas del reporte LCOV
      - name: Normalize LCOV paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const reportPath = 'server/coverage/lcov.info';

          if (!fs.existsSync(reportPath)) {
            throw new Error(`Coverage report not found: ${reportPath}`);
          }

          let report = fs.readFileSync(reportPath, 'utf8');

          report = report.replace(/\\/g, '/');

          report = report.replace(
            /^SF:(?:\.\/)?(?:server\/)?controllers\//gm,
            'SF:server/controllers/'
          );

          report = report.replace(
            /^SF:(?:\.\/)?(?:server\/)?models\//gm,
            'SF:server/models/'
          );

          fs.writeFileSync(reportPath, report);

          const sourceFiles = report
            .split(/\r?\n/)
            .filter(line => line.startsWith('SF:'));

          console.log('Normalized LCOV source paths:');
          console.log(sourceFiles.join('\n'));

          if (sourceFiles.length === 0) {
            throw new Error('The LCOV report contains no source files.');
          }
          NODE

      # 8. Analizar codigo y esperar la decision del Quality Gate
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@016cabf33a6b7edf0733e179a03ad408ad4e88ba # v5.3.1
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=server/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 9. Ejecutar pruebas de API con Newman
      - name: Run API tests with Newman
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Error: falta configurar el secreto API_BASE_URL."
            exit 1
          fi

          npx --yes newman@6 run \
            "Postman/LibraryManagement API Tests.postman_collection.json" \
            --env-var "baseUrl=$API_BASE_URL"
